[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nosee"
version = "0.1.0"
description = "Local macOS privacy-lookout menu bar app"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.26,<2",
  "opencv-contrib-python>=4.10,<5",
  "mediapipe==0.10.21",
  "sentencepiece==0.2.2",
  "torch>=2.2,<2.3",
  "scipy>=1.13",
  "pyobjc-framework-Cocoa>=11",
  "pyobjc-framework-Quartz>=11",
  "pyobjc-framework-Security>=11",
]

[project.scripts]
nosee = "nosee.ui:main"
nosee-install-models = "nosee.install_models:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
